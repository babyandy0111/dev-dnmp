server {
    listen       80;
    server_name  localhost admin.stockviva.local static.stockviva.local;
    root   /var/www/html/stockviva-core/public;

    #access_log /dev/null;
    access_log  /var/log/dnmp/nginx.stockviva-admin.access.log  main;
    error_log  /var/log/dnmp/nginx.stockviva-admin.error.log  warn;

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location / {
      index  index.php index.html index.htm;
      try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
       rewrite ^/(.*)$ /index.php?_url=/$1;
    }

    location ~ \.php?.*$ {
       try_files $uri /index.php =404;
       fastcgi_pass php:9000;
       fastcgi_split_path_info ^(.+\.php)(/.+)$;
       fastcgi_index index.php;
       fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
       fastcgi_param PATH_INFO $fastcgi_path_info;
       fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
       fastcgi_buffers 16 16k;
       fastcgi_buffer_size 32k;
       include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
       deny  all;
    }
}