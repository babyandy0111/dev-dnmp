services:
  gitlab:
    container_name: gitlab
    hostname: localhost
    restart: unless-stopped
    image: gitlab/gitlab-ce:latest
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8000'
        nginx['listen_port'] = 80          # 強制容器內 Nginx 監聽 80 port，與 docker-compose 的 8000:80 映射對接
        gitlab_rails['gitlab_shell_ssh_port'] = 8822
        # 修正 macOS Docker 掛載資料夾不支援 Unix Sockets (ENOTSUP) 的問題
        puma['socket'] = '/tmp/puma.socket'
        gitlab_workhorse['listen_addr'] = '/tmp/gitlab-workhorse.socket'
        # 針對本機開發環境優化以減少記憶體佔用，避免隨機 502
        puma['worker_processes'] = 0       # 啟用單進程模式（預設是依 CPU 核心數多進程，極度消耗記憶體）
        puma['min_threads'] = 2            # 減少執行緒
        puma['max_threads'] = 4
        sidekiq['max_concurrency'] = 5     # 減少 Sidekiq 併發數（預設 20）
        prometheus_monitoring['enable'] = false # 關閉普羅米修斯監控（節省約 300MB+ 記憶體）
    ports:
      - "8000:80"
      - "8822:22"
    volumes:
      - ./gitlab:/etc/gitlab
      - ./gitlab/data/gitlab:/var/opt/gitlab
      - ./log:/var/log/gitlab
    networks:
      - gitlab

  gitlab-runner:
    container_name: gitlab-runner
    restart: unless-stopped
    image: gitlab/gitlab-runner:alpine
    privileged: true
    depends_on:
      - gitlab
    volumes:
      - ./gitlab/config/gitlab-runner:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitlab

  gitlab-runner-setup:
    image: docker:cli
    container_name: gitlab-runner-setup
    restart: "no"
    depends_on:
      - gitlab
      - gitlab-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gitlab/config/gitlab-runner:/etc/gitlab-runner
    networks:
      - gitlab
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "====== GitLab Runner 自動化設定 ======"
        echo "正在等待 GitLab 服務就緒..."
        while true; do
          STATUS=$$(docker inspect --format='{{.State.Health.Status}}' gitlab 2>/dev/null || echo "failed")
          if [ "$$STATUS" = "healthy" ]; then
            echo "✓ GitLab 伺服器已成功就緒！"
            break
          fi
          echo -n "."
          sleep 5
        done
        echo ""

        CONFIG_PATH="/etc/gitlab-runner/config.toml"
        if [ -f "$$CONFIG_PATH" ]; then
          if docker exec gitlab-runner gitlab-runner verify >/dev/null 2>&1; then
            echo "✓ GitLab Runner 已經成功註冊且連線中，無需重複註冊！"
            exit 0
          fi
        fi

        echo "正在向 GitLab 伺服器申請 Runner 註冊 Token..."
        TOKEN=$$(docker exec gitlab gitlab-rails runner "runner = Ci::Runner.create(runner_type: 'instance_type', description: 'Local Docker Runner', active: true, run_untagged: true); puts runner.persisted? ? 'TOKEN: ' + runner.token : 'ERROR'" 2>/dev/null | grep TOKEN | awk '{print $$2}')

        if [ -z "$$TOKEN" ] || [ "$$TOKEN" = "ERROR" ]; then
          echo "✗ 無法取得註冊 Token。"
          exit 1
        fi
        echo "✓ 成功獲取 Token: $$TOKEN"

        echo "正在註冊 gitlab-runner 容器..."
        docker exec gitlab-runner gitlab-runner register \
          --non-interactive \
          --url http://gitlab \
          --token "$$TOKEN" \
          --executor docker \
          --docker-image "python:3.9-slim" \
          --docker-volumes "/var/run/docker.sock:/var/run/docker.sock" \
          --docker-extra-hosts "host.docker.internal:host-gateway"

        echo "正在調校 config.toml 設定檔..."
        if ! grep -q "network_mode" "$$CONFIG_PATH"; then
          sed -i '/extra_hosts = \["host.docker.internal:host-gateway"\]/a \    network_mode = \"dev-dnmp_gitlab\"' "$$CONFIG_PATH"
        fi
        if ! grep -q "clone_url" "$$CONFIG_PATH"; then
          sed -i '/url = \"http:\/\/gitlab\"/a \  clone_url = \"http:\/\/gitlab\"' "$$CONFIG_PATH"
        fi

        echo "正在重啟 gitlab-runner 套用新設定..."
        docker restart gitlab-runner
        echo "🎉 GitLab Runner 已經完全自動註冊與設定完成！"

networks:
  gitlab:
