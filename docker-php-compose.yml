version: "3"
services:
  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: nginx
    depends_on:
      - php
    ports:
      - "30080:80"
      - "443:443"
    volumes:
      - ./www/:/var/www/html/:rw
      - ./conf/fastcgi_params:/etc/nginx/fastcgi_params:ro
      - ./conf/conf.d:/etc/nginx/conf.d/:ro
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./log/:/var/log/dnmp/:rw
    networks:
      - net-php

  php:
    build: "./php/${PHP_VERSION}/"
    container_name: php
    expose:
      - "9000"
    volumes:
      - ./www/:/var/www/html/:rw
      - ./conf/php.ini:/usr/local/etc/php/php.ini:ro
      - ./conf/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf:rw
      - ./log/:/var/log/dnmp/:rw
    networks:
      - net-php
      - net-mysql
      - net-redis
      - net-elk

networks:
  net-php:
  net-mysql:
  net-redis:
  net-elk:
